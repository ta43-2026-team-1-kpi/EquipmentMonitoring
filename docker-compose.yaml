services:
  db:
    image: postgres:17.2
    container_name: equipment-monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-monitoring-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Swagger__Enabled: "true"
      Http__UseHttpsRedirection: "false"
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__EquipmentDatabase: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT}:8080"
    networks:
      - monitoring_net

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: equipment-monitoring-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
